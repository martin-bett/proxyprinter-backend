name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mtguser
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: proxymaster
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mtguser"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/proxymaster
      SPRING_DATASOURCE_USERNAME: mtguser
      SPRING_DATASOURCE_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Schema anlegen
        run: psql -v ON_ERROR_STOP=1 -f src/main/resources/init.sql
        env:
          PGHOST: localhost
          PGUSER: mtguser
          PGPASSWORD: ci
          PGDATABASE: proxymaster
      - name: Bauen und testen
        run: mvn -B verify

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Docker-Image bauen (ohne Push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker.dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
