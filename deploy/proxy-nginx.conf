# TLS-Proxy vor dem Frontend-Container (entspricht der bisherigen nginx.conf aus mtgprint-front).
# Das Frontend-Image leitet /api selbst an den Backend-Container weiter.
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    client_max_body_size 50m;
    # Docker-DNS: Container-IPs werden neu aufgelöst, wenn das Frontend neu gestartet wurde
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name proxyprinter.eu www.proxyprinter.eu;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name proxyprinter.eu www.proxyprinter.eu;

        ssl_certificate /etc/letsencrypt/live/proxyprinter.eu/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/proxyprinter.eu/privkey.pem;

        location / {
            set $frontend http://frontend:80;
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # PDF-Erzeugung kann lange dauern (Backend erlaubt 600 s)
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
