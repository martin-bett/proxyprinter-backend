spring.application.name=mtgprint
spring.mvc.async.request-timeout=600000
server.tomcat.connection-timeout=600000
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
server.tomcat.max-swallow-size=50MB

# Maximale PDF-Größe in MB, das Frontend liest den Wert über /api/pdf/limits (0 = keine Grenze)
pdf.max-size-mb=300
# Wie lange fertige PDFs und hochgeladene Bilder aufbewahrt und danach gelöscht werden
pdf.retention-days=7
upload.retention-days=7

# E-Mail-Versand (Download-Link, wenn ein PDF fertig ist). Ohne spring.mail.host ist er abgeschaltet
# und das Frontend graut das Feld aus. Zugangsdaten nur auf dem Server setzen, nie committen:
# SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, MAIL_FROM, APP_PUBLIC_URL.
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
# Absender, Standard ist spring.mail.username
# mail.from=noreply@proxyprinter.eu
# Basis-URL für den Link in der Mail
app.public-url=https://proxyprinter.eu
# Schutz gegen Spam an fremde Adressen
mail.max-per-recipient-per-hour=10

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=proxymaster


spring.datasource.url=jdbc:postgresql://localhost:5432/proxymaster
spring.datasource.username=mtguser
spring.datasource.password=mtgpassword
# Zugänge für Gallery-Configs (Feld "credential" der Config). Die Werte nur auf dem Server setzen, nie committen,
# z. B. als Umgebungsvariablen GALLERY_CREDENTIALS_REDDIT_COOKIE oder GALLERY_CREDENTIALS_REDDIT_AUTHORIZATION.
# Gesendet wird nur an den hinterlegten Host (inkl. Subdomains), nie ans Frontend.
gallery.credentials.reddit.host=reddit.com
# gallery.credentials.reddit.cookie=
# gallery.credentials.reddit.authorization=
# gallery.credentials.reddit.user-agent=

# User-API-Configs, die so viele Tage weder gesucht noch bearbeitet wurden, löscht ein nächtlicher Job
# (Standard-Configs ohne Ersteller bleiben). 0 = nie löschen
apiconfig.cleanup.max-unused-days=180

# Logs ab log.db.level zusätzlich in die Tabelle proxymaster.app_log (Tabelle legt sql/2026-10-04_app_log.sql an, läuft beim Deploy automatisch).
# Logdatei und Konsole bleiben wie gehabt. Ältere Einträge als retention-days löscht ein Job jede Nacht um 3:30.
log.db.enabled=true
log.db.level=INFO
log.db.retention-days=30

# Gemeinsamer Such-Cache (/api/search-cache): Suchergebnisse der Frontends als JSON-Dateien unter searchcache.dir
# (im Container /app/search-cache, liegt in einem eigenen Volume). Einträge gelten retention-days Tage,
# ältere löscht ein Job jede Nacht um 3:45. Umgebungsvariablen: SEARCHCACHE_ENABLED, SEARCHCACHE_RETENTION_DAYS usw.
searchcache.enabled=true
searchcache.dir=search-cache
searchcache.retention-days=7
# Größere Einzelergebnisse (inkl. Rohdaten) werden nicht gespeichert
searchcache.max-entry-kb=2048
